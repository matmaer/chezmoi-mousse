[project]
name = "chezmoi-mousse"
version = "0.2.5"
description = "Visual interface in the terminal for the chezmoi dotfile manager, with a wink to the mouse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.license]
file = "LICENSE"

[[project.authors]]
name = "matmaer"
email = "matmaer@proton.me"

[project.urls]
Repository = "https://github.com/matmaer/chezmoi-mousse"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "faker",
    "nuitka>=4.1.3",
    "pre-commit",
    "psutil",
    "pyright>=1.1.411",
    "pytest",
    "pytest-timeout",
    "ruff",
    "textual-dev",
    "twine",
    "types-psutil",
]

[tool.pre-commit]
config = ".pre-commit-config.yaml"

[tool.pytest.ini_options]
addopts = [
    "--color=auto",
    "--tb=no",                # Hide long stack traces
    "--capture=no",           # Don't capture stdout (allow prints)
    "--no-header",            # Hide boilerplate intro
    "-p", "no:cacheprovider", # Disable .pytest_cache generation
    "--timeout=15"            # Fail tests taking longer than 15s
]
testpaths = ["static_tests"]
pythonpath = [".", "src"]
# discovered test files, all .py files except starting with underscore
python_files = ["[!_]*.py"]
# limit pytest output in the terminal
truncation_limit_chars = 4000
truncation_limit_lines = 100

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "ARG",     # Unused arguments
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "E",       # pycodestyle errors
    "ERA001",  # eradicate (commented-out code)
    "F",       # Pyflakes
    "I",       # isort
    "N",       # Naming
    "PGH",     # pygrep-hooks replacements
    "PLE",     # pylint errors
    "PT",      # Pytest style
    "PTH",     # Use pathlib
    "RUF012",  # flake8-class-attributes
    "SIM",     # Simplify
    "TCH",     # flake8-type-checking
    "TID",     # flake8-tidy-imports (bans relative parent imports)
    "UP",      # pyupgrade
    "W",       # pycodestyle
]
extend-safe-fixes = [
    "TCH",     # move imports into TYPE_CHECKING blocks
    "UP006",   # use standard collections like list[str] instead of typing.List[str]
    "UP007",   # use X | Y union syntax instead of Optional[X] or Union[X, Y]
    "C408",    # rewrite dict()/list()/tuple() calls to literals {}, []
    "RUF013",  # prefer implicit Optional for default None arguments
    "B006",    # replace mutable default arguments like arg=[] with None
    "SIM108",  # convert simple if-else blocks into ternary expressions
    "PTH123",  # convert open() to Path.open()
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.codespell]
check-filenames = true
ignore-words-list = "ReAdd,re-add"

[tool.pyright]
reportUnknownMemberType = "information"
typeCheckingMode = "strict"
pythonVersion = "3.13"
extraPaths = ["src"]
include = ["src", "static_tests"]
