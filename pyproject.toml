[project]
name = "chezmoi-mousse"
version = "0.2.5"
description = "Visual interface in the terminal for the chezmoi dotfile manager, with a wink to the mouse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.license]
file = "LICENSE"

[[project.authors]]
name = "matmaer"
email = "matmaer@proton.me"

[project.urls]
Repository = "https://github.com/matmaer/chezmoi-mousse"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "docformatter",
    "faker",
    "nuitka>=4.1.3",
    "pre-commit",
    "psutil",
    "pyright>=1.1.411",
    "pytest",
    "pytest-timeout",
    "ruff",
    "textual-dev",
    "tomlkit",
    "twine",
    "types-psutil",
]

[tool.pre-commit]
config = ".pre-commit-config.yaml"

[tool.pytest.ini_options]
addopts = [
    "--color=auto",
    "--tb=no",                # Hide long stack traces
    "--capture=no",           # Don't capture stdout (allow prints)
    "--no-header",            # Hide boilerplate intro
    "-p", "no:cacheprovider", # Disable .pytest_cache generation
    "--timeout=15"            # Fail tests taking longer than 15s
]
testpaths = ["static_tests"]
pythonpath = [".", "src"]
# discovered test files, all .py files except starting with underscore
python_files = ["[!_]*.py"]
# limit pytest output in the terminal
truncation_limit_chars = 4000
truncation_limit_lines = 100

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true

[tool.ruff.lint]
select = [
    "ARG",     # Unused arguments
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "E",       # pycodestyle errors
    "ERA001",  # eradicate (commented-out code)
    "F",       # Pyflakes
    "I",       # isort
    "N",       # Naming
    "PLE",     # pylint errors
    "PT",      # Pytest style
    "PTH",     # Use pathlib
    "RUF012",  # flake8-class-attributes
    "SIM",     # Simplify
    "UP",      # pyupgrade
    "W",       # pycodestyle
]

[tool.codespell]
check-filenames = true
ignore-words-list = "ReAdd,re-add"
