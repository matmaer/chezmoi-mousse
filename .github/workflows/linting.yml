name: Lint and Format (ruff)
on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'

jobs:
  linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v6
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Run ruff check
      run: uv run ruff check .
    - name: Run ruff format
      run: uv run ruff format --check .
    - name: Verify app can be imported
      run: uv run python -c "import chezmoi_mousse; print('Import successful')"
      env:
        PYTHONPATH: src