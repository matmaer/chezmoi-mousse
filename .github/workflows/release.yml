name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Nuitka Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true

      - name: Install system dependencies for Nuitka 
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf gcc

      - name: Install Python dependencies
        run: uv sync --no-dev
      - name: Compile Executable with Nuitka
        run: |
          uv run --no-dev --with "nuitka[onefile]" nuitka \
            --mode=onefile \
            --remove-output \
            --output-filename=chezmoi-mousse-${{ github.ref_name }} \
            --include-package-data=chezmoi_mousse \
            --include-package-data=textual \
            src/chezmoi_mousse
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chezmoi-mousse-${{ github.ref_name }}